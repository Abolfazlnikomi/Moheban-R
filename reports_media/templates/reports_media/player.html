<figure class="asset asset-{{ item.kind }}">
  {% if item.kind == 'image' %}
    <a href="{{ source }}" target="_blank" rel="noopener noreferrer">
      <img src="{{ source }}" alt="{{ item.attachment.caption|default:post.title }}" loading="lazy" referrerpolicy="no-referrer">
    </a>
  {% elif item.kind == 'video' %}
    <video controls playsinline preload="metadata" src="{{ source }}">
      مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
    </video>
  {% elif item.kind == 'audio' %}
    <audio controls preload="none" src="{{ source }}">
      مرورگر شما از پخش صدا پشتیبانی نمی‌کند.
    </audio>
  {% elif item.kind == 'frame' or item.kind == 'document_frame' %}
    <iframe src="{{ source }}" title="{{ item.attachment.caption|default:'نمایشگر چندرسانه‌ای' }}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  {% endif %}

  <figcaption>
    {% if item.attachment.caption %}
      <span style="font-weight: 600; color: var(--text-main);">{{ item.attachment.caption }}</span>
    {% endif %}
    <div class="asset-actions">
      {% if item.online_url %}
        <a href="{{ item.online_url }}" target="_blank" rel="noopener noreferrer">
          {% if item.kind == 'document' %}مشاهده سند آنلاین ↗{% else %}لینک اصلی رسانه ↗{% endif %}
        </a>
      {% endif %}
      {% if local_url %}
        <a href="{{ local_url }}?download=1" style="color: var(--accent);">دانلود مستقیم فایل ↓</a>
      {% endif %}
    </div>
  </figcaption>
</figure>
