<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="field">
      {{ field.label_tag }}{% if field.field.required %}<span aria-label="اجباری"> *</span>{% endif %}
      {{ field }}
      {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
      {{ field.errors }}
    </div>
  {% endfor %}
  <button type="submit">{{ button }}</button>
</form>
