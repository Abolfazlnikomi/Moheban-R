<div class="workspace-tiles-grid">
  {% for link in links %}
  <a href="{{ link.url }}" class="workspace-tile-card">
    <div class="workspace-tile-icon">
      <svg class="portal-icon" aria-hidden="true">
        <use href="#portal-{{ link.icon|default:'layers' }}"/>
      </svg>
    </div>
    <div class="workspace-tile-info">
      <h3>{{ link.name }}</h3>
      {% if link.description %}
        <p>{{ link.description }}</p>
      {% endif %}
    </div>
    <div class="workspace-tile-arrow">
      <svg class="portal-icon" aria-hidden="true"><use href="#portal-chevron-left"/></svg>
    </div>
  </a>
  {% endfor %}
</div>
