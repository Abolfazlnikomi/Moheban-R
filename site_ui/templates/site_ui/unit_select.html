<div class="unit-select">
  <label for="id_unit">واحد یا زیرواحد</label>
  <select name="unit" id="id_unit">
    <option value="">همهٔ محتواها</option>
    <option value="public"{% if scope.selected == 'public' %} selected{% endif %}>فقط محتوای عمومی</option>
    {% for option in scope.options %}
      <option value="{{ option.id }}"{% if scope.selected == option.id %} selected{% endif %}>{{ option.label }}</option>
    {% endfor %}
  </select>
</div>
